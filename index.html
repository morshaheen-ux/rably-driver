<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تسجيل السائقين | Driver Registration</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="title"></h1>
    <button type="button" class="btn small" id="langBtn"></button>
  </header>

  <div id="setupWarn" class="banner warn hidden" data-i18n="setupWarn"></div>

  <main id="formView">
    <p class="sub" data-i18n="intro"></p>
    <form id="form" novalidate>
      <section class="card">
        <h2 data-i18n="secJoin"></h2>
        <div class="choices" id="box-vehicleType">
          <label class="choice">
            <input type="radio" name="vehicleType" value="car">
            <span class="choice-text">
              <strong data-i18n="tCar"></strong>
              <small data-i18n="needLicence"></small>
            </span>
            <span class="choice-art"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M5 29v-7l7-2 8-9h19l10 9 9 2v7"/><path d="M22 20l5-6h11l6 6z"/><path d="M23 29h18"/><circle cx="17" cy="30" r="5"/><circle cx="47" cy="30" r="5"/></svg></span>
          </label>
          <label class="choice">
            <input type="radio" name="vehicleType" value="ebike">
            <span class="choice-text">
              <strong data-i18n="tEbike"></strong>
              <small data-i18n="noLicence"></small>
            </span>
            <span class="choice-art"><svg viewBox="0 0 64 40" aria-hidden="true"><circle cx="13" cy="27" r="9"/><circle cx="51" cy="27" r="9"/><path d="M13 27l10-15h18l10 15"/><path d="M23 12l9 15h-19"/><path d="M32 27l9-15"/><path d="M19 12h8"/><path d="M41 12l-2-6h6"/><path d="M33 1l-4 5h4l-3 4"/></svg></span>
          </label>
          <label class="choice">
            <input type="radio" name="vehicleType" value="emotorcycle">
            <span class="choice-text">
              <strong data-i18n="tEmoto"></strong>
              <small data-i18n="needLicence"></small>
            </span>
            <span class="choice-art"><svg viewBox="0 0 64 40" aria-hidden="true"><circle cx="13" cy="30" r="6"/><circle cx="51" cy="30" r="6"/><path d="M19 30h20l8-22"/><path d="M42 8h9"/><path d="M13 30v-8h16v8"/><path d="M12 19h18"/><path d="M28 3l-5 7h5l-4 6"/></svg></span>
          </label>
        </div>
        <div class="err" data-err="vehicleType"></div>
        <div class="grid two hidden" id="carFields" style="margin-top:14px">
          <label class="field"><span data-i18n="carModel"></span>
            <input type="text" name="carModel" maxlength="80">
            <div class="err" data-err="carModel"></div></label>
          <label class="field"><span data-i18n="carYear"></span>
            <input type="text" name="carYear" class="ltr" inputmode="numeric" maxlength="4" placeholder="2015">
            <div class="err" data-err="carYear"></div></label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="secPersonal"></h2>
        <div class="grid two">
          <label class="field"><span data-i18n="firstName"></span>
            <input type="text" name="firstName" maxlength="60" autocomplete="given-name">
            <div class="err" data-err="firstName"></div></label>
          <label class="field"><span data-i18n="lastName"></span>
            <input type="text" name="lastName" maxlength="60" autocomplete="family-name">
            <div class="err" data-err="lastName"></div></label>
          <label class="field"><span data-i18n="fatherName"></span>
            <input type="text" name="fatherName" maxlength="60">
            <div class="err" data-err="fatherName"></div></label>
          <label class="field"><span data-i18n="birthDate"></span>
            <input type="date" name="birthDate" autocomplete="bday">
            <div class="err" data-err="birthDate"></div></label>
          <label class="field"><span data-i18n="birthPlace"></span>
            <input type="text" name="birthPlace" maxlength="120">
            <div class="err" data-err="birthPlace"></div></label>
          <label class="field"><span data-i18n="currentAddress"></span>
            <input type="text" name="currentAddress" maxlength="200" autocomplete="street-address">
            <div class="err" data-err="currentAddress"></div></label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="secContact"></h2>
        <div class="grid two">
          <label class="field"><span data-i18n="phone"></span>
            <input type="tel" name="phone" class="ltr" inputmode="tel" maxlength="20" placeholder="+963 9XX XXX XXX" autocomplete="tel">
            <div class="err" data-err="phone"></div></label>
          <label class="field"><span><span data-i18n="email"></span> <span class="opt" data-i18n="optional"></span></span>
            <input type="email" name="email" class="ltr" maxlength="120" placeholder="name@example.com" autocomplete="email">
            <div class="err" data-err="email"></div></label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="secPhotos"></h2>
        <p class="sub" data-i18n="photosIntro"></p>
        <div class="grid" id="photoBoxes"></div>
      </section>

      <section class="card">
        <label class="consent">
          <input type="checkbox" name="consent">
          <span data-i18n="consent"></span>
        </label>
        <div class="err" data-err="consent"></div>
      </section>

      <div id="submitErr" class="banner error hidden" role="alert"></div>
      <button type="submit" class="btn primary block" id="submitBtn" data-i18n="submit"></button>
    </form>
  </main>

  <main id="doneView" class="card done hidden">
    <div class="tick">✓</div>
    <h2 data-i18n="doneTitle"></h2>
    <p data-i18n="doneText"></p>
    <p><span data-i18n="refLabel"></span> <strong class="ref" id="refId"></strong></p>
  </main>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const T = {
  ar: {
    title: "تسجيل السائقين",
    intro: "املأ بياناتك والتقط الصور المطلوبة. يستغرق ذلك حوالي ٥ دقائق.",
    setupWarn: "لم يتم ربط النموذج بـ Firebase بعد. عدّل الملف firebase-config.js.",
    secJoin: "انضم كسائق توصيل",
    tCar: "انضم كسائق بسيارة",
    tEbike: "انضم كسائق بدراجة كهربائية",
    tEmoto: "انضم كسائق بدراجة نارية كهربائية",
    needLicence: "تحتاج إلى شهادة سواقة", noLicence: "لا تحتاج إلى شهادة سواقة",

    secPersonal: "البيانات الشخصية",
    firstName: "الاسم", lastName: "الكنية", fatherName: "اسم الأب",
    birthDate: "تاريخ الولادة", birthPlace: "مكان الولادة",
    currentAddress: "مكان الإقامة الحالي",
    secContact: "بيانات التواصل", phone: "رقم الهاتف", email: "البريد الإلكتروني",
    optional: "(اختياري)",
    secPhotos: "الصور المطلوبة",
    photosIntro: "تُلتقط جميع الصور الآن بكاميرا الجهاز، ولا يمكن رفع صور محفوظة.",
    idPhoto: "الهوية — الوجه الأمامي", idPhotoBack: "الهوية — الوجه الخلفي (ظهر الهوية)",
    licensePhoto: "شهادة السواقة — الوجه الأمامي", licensePhotoBack: "شهادة السواقة — الوجه الخلفي (ظهر الشهادة)",
    selfie: "صورة شخصية مباشرة",
    docHint: "يجب أن تظهر الوثيقة كاملة وواضحة.",
    selfieHint: "الوجه واضح ومضاء، بدون نظارات شمسية.",
    openCamera: "فتح الكاميرا", capture: "التقاط", retake: "إعادة الالتقاط",
    consent: "أوافق على حفظ بياناتي وصوري لغرض دراسة طلب انضمامي كسائق.",
    submit: "إرسال الطلب", sending: "جارٍ الإرسال…",
    doneTitle: "تم استلام طلبك",
    doneText: "شكراً لك. سنراجع بياناتك ونتواصل معك على رقم الهاتف الذي أدخلته.",
    refLabel: "رقم الطلب:",
    eRequired: "هذا الحقل مطلوب.", eVehicle: "اختر طريقة الانضمام.",
    eYear: "أدخل سنة صنع صحيحة من ٤ أرقام، مثال: 2015",
    eDate: "أدخل تاريخ ولادة صحيحاً (العمر ١٨ سنة على الأقل).",
    ePhone: "أدخل رقم هاتف صحيحاً، مثال: ‎+963912345678",
    eEmail: "البريد الإلكتروني غير صحيح.",
    ePhoto: "هذه الصورة مطلوبة.", eImage: "تعذّرت قراءة الصورة. التقطها مرة أخرى.",
    eCamera: "تعذّر فتح الكاميرا داخل الصفحة. اسمح باستخدام الكاميرا، أو اضغط الزر لفتح كاميرا الهاتف.",
    eConsent: "الموافقة مطلوبة لإرسال الطلب.",
    eFix: "يوجد حقول ناقصة أو غير صحيحة. راجع الحقول المحددة بالأحمر.",
    eSend: "تعذّر إرسال الطلب. تحقق من الاتصال بالإنترنت وحاول مرة أخرى.",
    langBtn: "English"
  },
  en: {
    title: "Driver Registration",
    intro: "Fill in your details and take the required photos. It takes about 5 minutes.",
    setupWarn: "This form is not connected to Firebase yet. Edit firebase-config.js.",
    secJoin: "Join as a delivery driver",
    tCar: "Join as a driver using a car",
    tEbike: "Join as a driver using an electric bike",
    tEmoto: "Join as a driver using an electric motorcycle",
    needLicence: "Driving licence needed", noLicence: "No driving licence needed",
    carModel: "Vehicle model", carYear: "Year of manufacture",
    secPersonal: "Personal details",
    firstName: "First name", lastName: "Surname", fatherName: "Father's name",
    birthDate: "Date of birth", birthPlace: "Place of birth",
    currentAddress: "Current place of residence",
    secContact: "Contact details", phone: "Phone number", email: "Email",
    optional: "(optional)",
    secPhotos: "Required photos",
    photosIntro: "All photos are taken now with your device camera. Saved photos cannot be uploaded.",
    idPhoto: "ID card — front", idPhotoBack: "ID card — back",
    licensePhoto: "Driving licence — front", licensePhotoBack: "Driving licence — back",
    selfie: "Live personal photo",
    docHint: "The whole document must be visible and clear.",
    selfieHint: "Face clear and well lit, no sunglasses.",
    openCamera: "Open camera", capture: "Capture", retake: "Retake",
    consent: "I agree to my details and photos being stored to review my application as a driver.",
    submit: "Submit application", sending: "Sending…",
    doneTitle: "Application received",
    doneText: "Thank you. We will review your details and contact you on the phone number you entered.",
    refLabel: "Reference:",
    eRequired: "This field is required.", eVehicle: "Choose how you want to join.",
    eYear: "Enter a valid 4-digit year, e.g. 2015",
    eDate: "Enter a valid date of birth (you must be at least 18).",
    ePhone: "Enter a valid phone number, e.g. +963912345678",
    eEmail: "This email address is not valid.",
    ePhoto: "This photo is required.", eImage: "Could not read that photo. Take it again.",
    eCamera: "Could not open the camera in the page. Allow camera access, or press the button to use your phone's camera.",
    eConsent: "You must agree before submitting.",
    eFix: "Some fields are missing or invalid. Check the ones marked in red.",
    eSend: "Could not send your application. Check your internet connection and try again.",
    langBtn: "العربية"
  }
};

const PHOTO_KEYS = ["idPhoto", "idPhotoBack", "licensePhoto", "licensePhotoBack", "selfie"];
const LICENCE_KEYS = ["licensePhoto", "licensePhotoBack"];
const MOTOR = ["car", "emotorcycle"];         // need model, year and a driving licence
const NO_LICENCE = ["ebike"];             // licence photos are optional

let lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ar";
const t = k => T[lang][k];
const $ = s => document.querySelector(s);
const errors = {};          // field -> i18n key
const photos = {};          // photo key -> JPEG data URL
const fallback = {};        // photo key -> true when the in-page camera failed
let active = null;          // { key, stream } for the camera that is open now

// ---------- Build the five photo boxes ----------
$("#photoBoxes").innerHTML = PHOTO_KEYS.map(key => `
  <div class="photo" id="box-${key}">
    <span class="label"><span data-i18n="${key}"></span> <span class="opt hidden" data-opt data-i18n="optional"></span></span>
    <p class="hint" data-i18n="${key === "selfie" ? "selfieHint" : "docHint"}"></p>
    <video class="hidden${key === "selfie" ? " mirror" : ""}" playsinline muted></video>
    <img class="hidden" alt="">
    <div class="row">
      <button type="button" class="btn" data-act="open" data-i18n="openCamera"></button>
      <button type="button" class="btn primary hidden" data-act="shoot" data-i18n="capture"></button>
      <button type="button" class="btn hidden" data-act="retake" data-i18n="retake"></button>
      <label class="btn hidden" data-act="fallback"><span data-i18n="openCamera"></span>
        <input type="file" accept="image/*" capture="${key === "selfie" ? "user" : "environment"}" class="hidden"></label>
    </div>
    <div class="err" data-err="${key}"></div>
  </div>`).join("");

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("#langBtn").textContent = t("langBtn");
  document.querySelectorAll("[data-err]").forEach(el => {
    const k = errors[el.dataset.err];
    el.textContent = k ? t(k) : "";
  });
  if (!$("#submitErr").classList.contains("hidden")) $("#submitErr").textContent = t($("#submitErr").dataset.key);
}
$("#langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; render(); });

const configured = !String(firebaseConfig.apiKey || "").startsWith("YOUR_");
$("#setupWarn").classList.toggle("hidden", configured);
const db = configured ? getFirestore(initializeApp(firebaseConfig)) : null;

// Latin digits for Arabic-Indic input, e.g. ٠٩١٢ -> 0912
const toLatinDigits = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

function setError(key, msgKey) {
  if (msgKey) errors[key] = msgKey; else delete errors[key];
  const box = $(`#box-${key}`) || $(`[name="${key}"]:not([type=radio]):not([type=checkbox])`);
  if (box) box.classList.toggle("invalid", !!msgKey);
  const el = $(`[data-err="${key}"]`);
  if (el) el.textContent = msgKey ? t(msgKey) : "";
}

// ---------- Vehicle type ----------
const form = $("#form");
const field = name => new FormData(form).get(name) || "";
function syncVehicle() {
  const v = field("vehicleType");
  $("#carFields").classList.toggle("hidden", !MOTOR.includes(v));
  for (const k of LICENCE_KEYS) {
    $(`#box-${k} [data-opt]`).classList.toggle("hidden", !NO_LICENCE.includes(v));
    if (NO_LICENCE.includes(v) && errors[k] === "ePhoto") setError(k, null);
  }
}
form.querySelectorAll('[name="vehicleType"]').forEach(r => r.addEventListener("change", () => {
  setError("vehicleType", null);
  syncVehicle();
}));

// ---------- Photos ----------
// Photos are shrunk in the browser and stored as JPEG data URLs in Firestore,
// so each must stay well under Firestore's 1 MB document limit.
const MAX_CHARS = 700000;
function shrink(source, w, h) {
  let scale = Math.min(1, 1400 / Math.max(w, h));
  let quality = 0.8;
  const canvas = document.createElement("canvas");
  for (let i = 0; i < 12; i++) {
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
    const url = canvas.toDataURL("image/jpeg", quality);
    if (url.length <= MAX_CHARS) return url;
    if (quality > 0.5) quality -= 0.1; else scale *= 0.8;
  }
  throw new Error("image too large");
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try { resolve(shrink(img, img.naturalWidth, img.naturalHeight)); }
      catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable")); };
    img.src = url;
  });
}

// Show the right preview and buttons for one photo box.
function sync(key) {
  const box = $(`#box-${key}`);
  const live = active?.key === key;
  const has = !!photos[key];
  const act = a => box.querySelector(`[data-act="${a}"]`);
  box.querySelector("video").classList.toggle("hidden", !live);
  box.querySelector("img").classList.toggle("hidden", live || !has);
  act("shoot").classList.toggle("hidden", !live);
  act("open").classList.toggle("hidden", live || has || !!fallback[key]);
  act("retake").classList.toggle("hidden", live || !has || !!fallback[key]);
  act("fallback").classList.toggle("hidden", live || !fallback[key]);
}
function setPhoto(key, dataUrl) {
  photos[key] = dataUrl;
  $(`#box-${key} img`).src = dataUrl;
  setError(key, null);
  sync(key);
}
function stopCamera() {
  if (!active) return;
  active.stream.getTracks().forEach(tr => tr.stop());
  const key = active.key;
  active = null;
  sync(key);
}
async function openCamera(key) {
  stopCamera();                       // only one camera open at a time
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("unsupported");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: key === "selfie" ? "user" : "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    active = { key, stream };
    const video = $(`#box-${key} video`);
    video.srcObject = stream;
    setError(key, null);
    sync(key);
    await video.play();
  } catch {
    // The page could not open the camera: hand over to the phone's own camera app.
    stopCamera();
    fallback[key] = true;
    setError(key, "eCamera");
    sync(key);
  }
}
for (const key of PHOTO_KEYS) {
  const box = $(`#box-${key}`);
  box.querySelector('[data-act="open"]').addEventListener("click", () => openCamera(key));
  box.querySelector('[data-act="retake"]').addEventListener("click", () => openCamera(key));
  box.querySelector('[data-act="shoot"]').addEventListener("click", () => {
    const video = box.querySelector("video");
    if (!video.videoWidth) return;
    try { setPhoto(key, shrink(video, video.videoWidth, video.videoHeight)); }
    catch { setError(key, "eImage"); return; }
    stopCamera();
  });
  const input = box.querySelector("input[type=file]");
  input.addEventListener("change", async () => {
    const file = input.files[0];
    if (!file) return;
    try { setPhoto(key, await fileToDataUrl(file)); }
    catch { setError(key, "eImage"); }
    input.value = "";
  });
}
window.addEventListener("pagehide", stopCamera);

// ---------- Validation and submit ----------
function collect() {
  const f = new FormData(form);
  const val = k => String(f.get(k) || "").trim().replace(/\s+/g, " ");
  const isCar = MOTOR.includes(val("vehicleType"));
  return {
    serviceType: "delivery",
    vehicleType: val("vehicleType"),
    carModel: isCar ? val("carModel") : "",
    carYear: isCar ? toLatinDigits(val("carYear")) : "",
    firstName: val("firstName"), lastName: val("lastName"), fatherName: val("fatherName"),
    birthDate: val("birthDate"), birthPlace: val("birthPlace"),
    currentAddress: val("currentAddress"),
    phone: toLatinDigits(val("phone")).replace(/[\s\-()]/g, ""),
    email: val("email").toLowerCase()
  };
}
function validate(d) {
  const e = {};
  if (!d.vehicleType) e.vehicleType = "eVehicle";
  if (MOTOR.includes(d.vehicleType)) {
    if (!d.carModel) e.carModel = "eRequired";
    const y = Number(d.carYear);
    if (!/^\d{4}$/.test(d.carYear) || y < 1970 || y > new Date().getFullYear() + 1) e.carYear = "eYear";
  }
  for (const k of ["firstName", "lastName", "fatherName", "birthPlace", "currentAddress"]) {
    if (!d[k]) e[k] = "eRequired";
  }
  const born = new Date(d.birthDate + "T00:00:00");
  const adult = new Date(); adult.setFullYear(adult.getFullYear() - 18);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.birthDate) || isNaN(born) || born > adult || born.getFullYear() < 1920) e.birthDate = "eDate";
  if (!/^\+?[0-9]{7,15}$/.test(d.phone)) e.phone = "ePhone";
  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) e.email = "eEmail";
  for (const k of PHOTO_KEYS) {
    const optional = NO_LICENCE.includes(d.vehicleType) && LICENCE_KEYS.includes(k);
    if (!photos[k] && !optional) e[k] = "ePhoto";
  }
  if (!form.consent.checked) e.consent = "eConsent";
  return e;
}
function showSubmitError(key) {
  const el = $("#submitErr");
  el.dataset.key = key;
  el.textContent = t(key);
  el.classList.remove("hidden");
}
form.addEventListener("input", ev => { if (ev.target.name) setError(ev.target.name, null); });

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  $("#submitErr").classList.add("hidden");
  const data = collect();
  const found = validate(data);
  const all = ["vehicleType", "carModel", "carYear", "firstName", "lastName", "fatherName",
               "birthDate", "birthPlace", "currentAddress", "phone", "email", ...PHOTO_KEYS, "consent"];
  all.forEach(k => setError(k, found[k] || null));
  const first = all.find(k => found[k]);
  if (first) {
    showSubmitError("eFix");
    ($(`#box-${first}`) || $(`[data-err="${first}"]`)).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (!db) { showSubmitError("setupWarn"); return; }

  const btn = $("#submitBtn");
  btn.disabled = true;
  btn.textContent = t("sending");
  try {
    // One atomic write: the driver record plus its photos.
    const ref = doc(collection(db, "drivers"));
    const batch = writeBatch(db);
    batch.set(ref, { ...data, lang, status: "new", createdAt: serverTimestamp() });
    for (const k of PHOTO_KEYS) {
      if (photos[k]) batch.set(doc(ref, "files", k), { data: photos[k], createdAt: serverTimestamp() });
    }
    await batch.commit();
    stopCamera();
    $("#refId").textContent = ref.id.slice(0, 8).toUpperCase();
    $("#formView").classList.add("hidden");
    $("#doneView").classList.remove("hidden");
    window.scrollTo(0, 0);
  } catch (err) {
    console.error(err);
    showSubmitError("eSend");
    btn.disabled = false;
    btn.textContent = t("submit");
  }
});

render();
syncVehicle();
</script>
</body>
</html>
